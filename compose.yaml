services:
  blog:
    build:
      context: .
      target: development
    command: ["pnpm", "exec", "astro", "dev", "--host", "0.0.0.0", "--port", "4321"]
    ports:
      - "127.0.0.1:4321:4321"
    volumes:
      - ./src:/app/src:ro
      - ./public:/app/public:ro
      - ./astro.config.ts:/app/astro.config.ts:ro
      - ./astro-paper.config.ts:/app/astro-paper.config.ts:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
