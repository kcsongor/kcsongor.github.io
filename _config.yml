# Site wide configuration

title:            '( )'
locale:           en_UK
url: 'https://kcsongor.github.io'


# Jekyll configuration

permalink:   /:categories/:title/
markdown:    kramdown
highlighter: rouge
sass:
  sass_dir: _sass
  style: compressed
plugins:
  - jekyll-sitemap

kramdown:
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  enable_coderay: false


# Site owner
owner:
  name: Csongor Kiss
  avatar: "https://avatars0.githubusercontent.com/u/313596?v=3&s=460"
  bio: "I write here once every 5 years"
  email:
  disqus-shortname:
  twitter: lowert #username
  google:
    analytics: 'UA-10056882-11'
  github: kcsongor #username
  linkedin: csongorkiss #username

include: [".htaccess"]
exclude: ["lib", "config.rb", "Capfile", "config", "log", "Rakefile", "Rakefile.rb", "tmp", "less", "*.sublime-project", "*.sublime-workspace", "test", "spec", "Gruntfile.js", "package.json", "node_modules", "Gemfile", "Gemfile.lock", "LICENSE", "README.md"]
